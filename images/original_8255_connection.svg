<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820"><defs><style>.t{font-family:Arial,sans-serif;fill:#20242a}.title{font-weight:700;font-size:34px}.head{font-weight:700;font-size:26px}.pin{font:20px monospace;fill:#20242a}.note{font-size:18px;fill:#444}.mz{fill:#dceeff;stroke:#39698e;stroke-width:4}.ard{fill:#e4f4ea;stroke:#3c7650;stroke-width:4}.conn{fill:#f4f4f4;stroke:#555;stroke-width:4}.wire{stroke:#2d2d2d;stroke-width:5;fill:none}.thin{stroke:#777;stroke-width:3;fill:none}.blue{stroke:#2b6cb0;stroke-width:5}.green{stroke:#2f855a;stroke-width:5}.red{stroke:#c53030;stroke-width:5}.gold{stroke:#9c7a16;stroke-width:5}</style><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker></defs>
<rect width="1400" height="820" fill="#fff"/><text x="700" y="50" text-anchor="middle" class="t title">Sharp MZ 8255 / CMT connection used by the original MZ-SD2CMT</text><text x="700" y="82" text-anchor="middle" class="t note">Local redraw of the original project connection concept; the same four CMT lines are retained by MZ-SD2CMT2.</text>
<rect x="70" y="145" width="390" height="530" rx="18" class="mz"/><text x="265" y="190" text-anchor="middle" class="t head">Sharp MZ side</text><rect x="130" y="235" width="270" height="330" rx="10" fill="#b9daf6" stroke="#39698e" stroke-width="4"/><text x="265" y="275" text-anchor="middle" class="t head">8255 PPI / CMT logic</text><text x="165" y="340" class="pin">WRITE</text><text x="165" y="415" class="pin">MOTOR</text><text x="165" y="490" class="pin">READ</text><text x="165" y="565" class="pin">SENSE</text><text x="265" y="620" text-anchor="middle" class="t note">CMT signals are controlled through the MZ I/O circuitry.</text>
<rect x="940" y="145" width="390" height="530" rx="18" class="ard"/><text x="1135" y="190" text-anchor="middle" class="t head">Arduino Mega / Mini Mega</text><text x="990" y="340" class="pin">D15 / RX3</text><text x="990" y="415" class="pin">D16 / TX2</text><text x="990" y="490" class="pin">D2 / OC3B</text><text x="990" y="565" class="pin">D18 / TX1</text><text x="1135" y="620" text-anchor="middle" class="t note">Original MZ-SD2CMT pin assignment preserved by MZ-SD2CMT2.</text>
<rect x="570" y="250" width="260" height="390" rx="16" class="conn"/><text x="700" y="290" text-anchor="middle" class="t head">CMT connector</text><text x="610" y="350" class="pin">WRITE / SDI</text><text x="610" y="425" class="pin">MOTOR / SSI</text><text x="610" y="500" class="pin">READ / SDO</text><text x="610" y="575" class="pin">SENSE / SSO</text>
<path d="M400 332 H570" class="wire blue"/><path d="M830 332 H940" class="wire blue"/><path d="M400 407 H570" class="wire green"/><path d="M830 407 H940" class="wire green"/><path d="M400 482 H570" class="wire red"/><path d="M830 482 H940" class="wire red"/><path d="M400 557 H570" class="wire gold"/><path d="M830 557 H940" class="wire gold"/>
<text x="700" y="715" text-anchor="middle" class="t note">SDI / SDO / SSI / SSO are also the signal names used by the original Ultra-Fast transfer protocol.</text><text x="700" y="750" text-anchor="middle" class="t note">Original project notes identify PC5 as SDO data and PC1 as SDI acknowledge during Ultra-Fast reads.</text></svg>